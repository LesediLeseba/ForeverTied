# MemorialCode V1 — local infrastructure.
#
# The API and frontend run on the host (see README) so hot reload works; this
# compose file provides the standard PostgreSQL instance they talk to.
#
#   cp .env.example .env   # then set the database credential in your copy
#   docker compose up -d
#   cd backend && alembic upgrade head && python scripts/seed.py
#
# All container credentials are read from that local, git-ignored .env via
# env_file below — no credential values live in this committed file.

services:
  postgres:
    image: postgres:16-alpine
    container_name: memorialcode-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - memorialcode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-memorialcode}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memorialcode_pgdata:
